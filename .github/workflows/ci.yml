name: Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Order Service with Maven
        run: |
          cd order-service
          mvn clean package -DskipTests

      - name: Build Kitchen Service with Maven
        run: |
          cd kitchen-service
          mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Order Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          file: ./order-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Build and Push Kitchen Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./kitchen-service
          file: ./kitchen-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kitchen-service:latest