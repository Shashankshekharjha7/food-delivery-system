name: Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-order-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/checkout@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Order Service with Maven
        run: |
          cd order-service
          mvn clean package -DskipTests

      - name: Build Kitchen Service with Maven
        run: |
          cd kitchen-service
          mvn clean package -DskipTests